<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>System</title>
<style>
:root {
  /* The app's tokens (frontend/assets/styles.css and desk.css): neutral greys, only the logo has colour. */
  --desk: #f3f2ef; --paper: #faf9f7; --card: #ffffff; --ink: #1d1d1f; --muted: #636368; --faint: #9a9a9f;
  --line: #e4e1da; --line-strong: #d6d2c9; --hover: rgb(0 0 0 / 4%); --select: #1d1d1f; --chip: rgb(0 0 0 / 5%);
  --warn: #8a642a; --warn-bg: #f6eedd; --bad: #8f3a30; --bad-bg: #f8e4e1; --good: #3d6b4f;
  --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  --sans: -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", sans-serif;
  --serif: var(--sans);
  --casys: #a48ea4;
  --dock-height: 64px; --dock-bottom: 8px; --dock-tile: 50px; --dock-gap: 14px;
  --stage-bottom: calc(var(--dock-height) + var(--dock-bottom) + 12px);
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font: 13.5px/1.5 var(--sans); color: var(--ink); background: var(--desk); display: flex; flex-direction: column; position: relative; overflow: hidden; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
/* Title bar: the ASE menu, then the system and its model, centred and discreet. */
.titlebar { flex: none; display: grid; grid-template-columns: 1fr minmax(0, auto) 1fr; align-items: center; gap: 16px; height: 44px; padding: 0 18px; position: relative; z-index: 30; }
.identity { display: flex; align-items: baseline; gap: 8px; justify-content: center; min-width: 0; }
.identity b { font-size: 13px; font-weight: 600; color: #3a3a3c; letter-spacing: -.01em; white-space: nowrap; }
.identity .ver { color: var(--muted); font-size: 12px; white-space: nowrap; }
.identity .ver::before { content: "·"; margin-right: 8px; }
.app-menu { position: relative; }
.app-menu > button { all: unset; cursor: pointer; padding: 3px 9px; border-radius: 7px; font-weight: 700; font-size: 13px; letter-spacing: .02em; }
.app-menu > button:hover, .app-menu.open > button { background: var(--hover); }
.app-menu .list { position: absolute; top: 30px; left: 0; min-width: 230px; padding: 5px; background: rgb(255 255 255 / 97%); border: 1px solid rgb(0 0 0 / 7%); border-radius: 12px; box-shadow: 0 14px 40px rgb(0 0 0 / 12%); display: none; }
.app-menu.open .list { display: block; }
.app-menu .list h6 { margin: 6px 10px 4px; font-size: 11px; font-weight: 600; color: var(--faint); }
.app-menu .list button { all: unset; box-sizing: border-box; display: flex; justify-content: space-between; width: 100%; padding: 5px 10px; border-radius: 7px; cursor: pointer; }
.app-menu .list button:hover { background: var(--hover); }
.app-menu .list hr { border: 0; border-top: 1px solid var(--line); margin: 5px 4px; }
.search { position: relative; }
.search input { width: 220px; font: inherit; font-size: 12.5px; padding: 5px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); outline: none; }
.search input:focus { border-color: var(--line-strong); }
.results { position: absolute; right: 0; top: 34px; width: 380px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 14px 40px rgb(0 0 0 / 12%); padding: 4px; z-index: 8; display: none; max-height: 60vh; overflow: auto; }
.results.open { display: block; }
.results button { all: unset; display: flex; gap: 8px; width: 100%; box-sizing: border-box; padding: 6px 8px; border-radius: 6px; cursor: pointer; }
.results button:hover, .results button.on { background: var(--hover); }
.results .where { margin-left: auto; color: var(--faint); font-size: 11.5px; }

/* The stage stops above the Dock. A content window fills it edge to edge; beside it, the
   conversation that rose from the logo becomes a pane split by a hairline. */
.stage { flex: 1 1 0; display: grid; grid-template-columns: minmax(0, 1fr); min-height: 0; padding: 0 0 var(--stage-bottom); }
.stage.talking { grid-template-columns: minmax(340px, 440px) minmax(0, 1fr); }
/* Alone, the conversation rises from the logo as in the app: a floating card with a small pointer.
   Beside a window it stays a pane split by a hairline. */
.stage { position: relative; }
.stage.talking:not(.has-window) { grid-template-columns: minmax(0, 640px); justify-content: center; padding: 8px 24px var(--stage-bottom); }
.stage.talking:not(.has-window) .conversation { align-self: end; height: min(620px, calc(100% - 8px)); margin-bottom: 8px; overflow: hidden; border: 1px solid rgb(0 0 0 / 6%); border-radius: 28px; background: rgb(255 255 255 / 94%); box-shadow: 0 24px 60px rgb(0 0 0 / 10%), 0 2px 6px rgb(0 0 0 / 4%); -webkit-backdrop-filter: blur(30px) saturate(1.3); backdrop-filter: blur(30px) saturate(1.3); }
.stage.talking:not(.has-window)::after { content: ""; position: absolute; left: 50%; bottom: calc(var(--stage-bottom) - 5px); margin-left: -12px; border: 12px solid transparent; border-bottom: 0; border-top-color: rgb(255 255 255 / 94%); }
.stage.closed:not(.talking) { visibility: hidden; }
.conversation { display: none; flex-direction: column; min-height: 0; background: rgb(255 255 255 / 92%); border-block: 1px solid var(--line); border-right: 1px solid var(--line); }
.stage.talking .conversation { display: flex; }
.conversation .agent { display: flex; align-items: baseline; gap: 8px; padding: 14px 16px; }
.conversation .agent b { font-size: 14px; }
.conversation .agent span { color: var(--muted); font-size: 12px; }
.conversation .thread { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; padding: 16px; color: var(--ink); font-size: 14px; }
.conversation .thread p { margin: 0; }
.conversation .thread > :first-child { margin-top: auto; }
.conversation .thread .me { align-self: flex-end; max-width: 85%; margin: 8px 0 0; padding: 7px 12px; border-radius: 16px; background: rgb(0 0 0 / 5.5%); overflow-wrap: anywhere; }
.conversation .composer { display: block; font: inherit; font-size: 14px; color: var(--ink); margin: 0 12px 12px; padding: 10px 14px; border: 1px solid var(--line); border-radius: 18px; background: #fff; outline: none; }
.conversation .composer::placeholder { color: var(--faint); }
.conversation .composer:focus { border-color: var(--line-strong); }
.window { container: win / inline-size; display: flex; flex-direction: column; min-width: 0; min-height: 0; background: #fff; border-block: 1px solid var(--line); position: relative; }
.stage:not(.has-window) .window { display: none; }
.win-head { flex: none; display: flex; align-items: center; gap: 12px; padding: 10px 56px 10px 16px; }
.win-head .title { font-size: 14px; font-weight: 600; letter-spacing: -.01em; }
.win-head .spacer { flex: 1; }
.win-close { all: unset; position: absolute; top: 10px; right: 12px; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: rgb(0 0 0 / 5%); color: #5a5a5f; cursor: pointer; font-size: 16px; }
.win-close:hover { background: rgb(0 0 0 / 9%); color: var(--ink); }
.win-body { flex: 1 1 0; display: grid; grid-template-columns: minmax(0, 1fr); min-height: 0; }

/* The Dock: the Casys logo at the centre, places and "To decide" on its right. */
.dock { position: absolute; left: 0; right: 0; bottom: var(--dock-bottom); height: var(--dock-height); display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: var(--dock-gap); padding: 0 16px; pointer-events: none; z-index: 25; }
.dock > * { pointer-events: auto; }
.dock .rest { display: flex; align-items: center; gap: var(--dock-gap); justify-self: start; }
.dock .work { display: flex; align-items: center; gap: var(--dock-gap); justify-self: end; }
.dock-tile b { font-size: 16px; font-weight: 600; letter-spacing: -.01em; color: #3a3a3c; }
/* Jobs and Watches are stacks, as in the app: two cards behind the tile, a small list above it. */
.dock-item.pile .dock-tile { box-shadow: 3px -3px 0 -1px #e6e3dd, 6px -6px 0 -2px #d8d5ce, 0 8px 22px rgb(0 0 0 / 9%), 0 1px 3px rgb(0 0 0 / 7%); }
.dock-stack-list { position: absolute; bottom: calc(100% + 16px); right: 0; min-width: 260px; padding: 8px 6px; border: 1px solid rgb(0 0 0 / 6%); border-radius: 14px; background: rgb(255 255 255 / 97%); box-shadow: 0 14px 40px rgb(0 0 0 / 12%); text-align: left; cursor: default; }
.dock-stack-title { margin: 4px 10px 6px; color: #6b6b70; font-size: 12px; font-weight: 600; letter-spacing: .02em; text-transform: uppercase; }
.dock-stack-empty { margin: 4px 10px 8px; color: #6b6b70; font-size: 14px; line-height: 1.4; }
.dock-item.pile.open .dock-label { opacity: 0; }
.dock-item { all: unset; position: relative; width: var(--dock-tile); height: var(--dock-tile); border-radius: 15px; cursor: pointer; transition: transform .15s ease; }
.dock-item:hover { transform: translateY(-3px); }
.dock-item[aria-disabled="true"] { cursor: default; opacity: .55; }
.dock-item[aria-disabled="true"]:hover { transform: none; }
.dock-tile { display: grid; place-items: center; width: 100%; height: 100%; border-radius: 15px; background: rgb(255 255 255 / 94%); box-shadow: 0 8px 22px rgb(0 0 0 / 9%), 0 1px 3px rgb(0 0 0 / 7%); }
.dock-tile svg { width: 24px; height: 24px; fill: none; stroke: #48484a; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.dock-item.active .dock-tile { background: #e2e2e5; }
.dock-item.active::after { content: ""; position: absolute; left: 50%; bottom: -9px; width: 5px; height: 5px; margin-left: -2.5px; border-radius: 50%; background: var(--ink); }
.dock-logo { all: unset; width: 64px; height: 64px; border-radius: 50%; background: var(--casys); cursor: pointer; box-shadow: 0 8px 22px rgb(0 0 0 / 9%); transition: transform .15s ease; }
.dock-logo:hover { transform: translateY(-3px); }
.dock-sep { width: 1px; height: 36px; background: rgb(0 0 0 / 14%); }
.dock-count { position: absolute; top: -6px; right: -6px; min-width: 20px; height: 20px; padding: 0 5px; box-sizing: border-box; display: grid; place-items: center; border: 2px solid #fff; border-radius: 10px; background: var(--ink); color: #fff; font-size: 11px; font-variant-numeric: tabular-nums; }
.dock-label { position: absolute; bottom: calc(100% + 10px); left: 50%; transform: translateX(-50%); padding: 3px 9px; border-radius: 7px; background: rgb(255 255 255 / 96%); box-shadow: 0 4px 14px rgb(0 0 0 / 10%); font-size: 12px; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity .12s; }
.dock-item:hover .dock-label, .dock-logo:hover + .dock-label { opacity: 1; }
nav.tabs { display: flex; gap: 2px; }
nav.tabs button { all: unset; cursor: pointer; padding: 4px 10px; border-radius: 8px; font-size: 13px; color: var(--muted); white-space: nowrap; }
nav.tabs button:hover { color: var(--ink); }
nav.tabs button[aria-current="page"] { color: var(--ink); background: rgb(0 0 0 / 5.5%); }
.search { display: flex; align-items: center; }
.search[hidden] { display: none; }
.search-btn { all: unset; cursor: pointer; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); }
.search-btn:hover { background: rgb(0 0 0 / 5%); color: var(--ink); }
.search-btn .ic { width: 17px; height: 17px; }
.search:not(.open) input { display: none; }
.search.open .search-btn { display: none; }
.more { position: relative; }
.more .menu { position: absolute; top: 34px; left: 0; background: var(--card); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 12px 30px rgb(0 0 0 / 8%); padding: 4px; display: none; z-index: 6; min-width: 190px; }
.more.open .menu { display: block; }
.more .menu button { display: block; width: 100%; box-sizing: border-box; }
.more > button { all: unset; cursor: pointer; padding: 4px 10px; border-radius: 8px; font-size: 13px; color: var(--muted); white-space: nowrap; }
.more > button:hover, .more.open > button { color: var(--ink); }
.more > button[aria-current="page"] { color: var(--ink); background: rgb(0 0 0 / 5.5%); }
.more .menu { z-index: 40; }
.more .menu button { all: unset; display: block; width: 100%; box-sizing: border-box; padding: 6px 10px; border-radius: 7px; cursor: pointer; font-size: 13px; }
.more .menu button:hover, .more .menu button[aria-current="page"] { background: var(--hover); }
.toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); cursor: pointer; user-select: none; }
.toggle input { accent-color: var(--ink); }
.sysml-frame { width: 100%; height: calc(100dvh - 44px - var(--stage-bottom) - 170px); min-height: 460px; border: 1px solid var(--line); border-radius: 14px; background: var(--card); }
.graph { position: relative; height: calc(100dvh - 44px - var(--stage-bottom) - 170px); min-height: 420px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.graph svg { width: 100%; height: 100%; display: block; cursor: grab; }
.graph .gl { stroke: var(--line-strong); stroke-width: 1; }
.graph .gl.contains { stroke-dasharray: 2 3; }
.graph .gl.lit { stroke: var(--ink); stroke-width: 1.6; }
.graph .gn circle { stroke: var(--card); stroke-width: 1.5; cursor: pointer; }
.graph .gn text { font: 11px var(--sans); fill: var(--ink); paint-order: stroke; stroke: var(--card); stroke-width: 3px; pointer-events: none; }
.graph.focus .gn:not(.lit):not(.sel) { opacity: .18; }
.graph.focus .gl:not(.lit) { opacity: .1; }
.graph .gn.sel circle { stroke: var(--ink); stroke-width: 2.5; }
.glegend { position: absolute; left: 12px; bottom: 10px; display: flex; gap: 12px; font-size: 11.5px; color: var(--muted); background: rgb(255 255 255 / 85%); padding: 4px 8px; border-radius: 8px; }
.glegend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 4px; vertical-align: -1px; }
nav.side { border-right: 1px solid var(--line); background: var(--paper); padding: 12px 8px; overflow: auto; }
nav.side h4 { margin: 14px 10px 4px; font-size: 10.5px; font-weight: 500; letter-spacing: .06em; color: var(--faint); text-transform: uppercase; }
nav.side button { all: unset; box-sizing: border-box; display: flex; align-items: center; width: 100%; padding: 5px 10px; border-radius: 7px; cursor: pointer; font-size: 13px; }
nav.side button:hover { background: var(--hover); }
nav.side button[aria-current="page"] { background: var(--ink); color: var(--paper); }
nav.side button .n { margin-left: auto; font-size: 11px; color: var(--faint); font-variant-numeric: tabular-nums; }
nav.side button[aria-current="page"] .n { color: #bdbab3; }
main { overflow: auto; scrollbar-gutter: stable; min-width: 0; min-height: 0; padding: 0 28px; container: page / inline-size; }
main h1 { font: 600 20px/1.3 var(--sans); letter-spacing: -.015em; margin: 0 0 4px; }
/* The frame: every page is a centred column, its title at the same place, content on the same edge. */
.page { max-width: 1080px; margin: 0 auto; padding: 36px 12px 56px; }
/* SysML takes the whole window width; its title stays where every page title is. */
main:has(> .page-sysml:not([hidden])) { overflow: hidden; padding: 0 16px; } /* same gutter as other pages, so the title lines up */
.page.page-sysml { max-width: none; padding: 36px 0 16px; }
.page.page-sysml > h1 { box-sizing: border-box; max-width: 1104px; padding: 0 24px; margin-left: auto; margin-right: auto; }
.page.page-sysml .sysml-frame { height: calc(100dvh - 44px - var(--stage-bottom) - 166px); }
.page > h1, .zen-head h1 { font: 600 22px/1.25 var(--sans); letter-spacing: -.02em; margin: 0 0 28px; }
main .lead { color: var(--muted); margin: 0 0 20px; max-width: 72ch; }
.empty { color: var(--muted); padding: 40px 0; text-align: center; }
.empty b { display: block; color: var(--ink); font-weight: 500; margin-bottom: 4px; }

/* shared element styles */
.kw { font: 500 10.5px var(--mono); color: var(--faint); letter-spacing: .01em; }
.ty { color: var(--muted); }
.qn { font: 11.5px var(--mono); color: var(--muted); word-break: break-all; }
.sum { color: var(--muted); font-size: 12px; margin-top: 3px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 1px 7px; border-radius: 999px; background: var(--chip); font-size: 11.5px; white-space: nowrap; }
.chip.warn { background: var(--warn-bg); color: var(--warn); }
.chip.bad { background: var(--bad-bg); color: var(--bad); }
.chip.ghost { background: transparent; border: 1px solid var(--line); }
.el { cursor: pointer; transition: opacity .15s ease, box-shadow .15s ease, background .15s ease; }
.el:hover { box-shadow: 0 0 0 1px var(--line-strong); }
.el.sel { box-shadow: 0 0 0 2px var(--select) !important; }
.dimmed .el:not(.lit):not(.sel):not(.rel-ctx) { opacity: .32; }
.el.lit { box-shadow: 0 0 0 1px var(--ink); }
.why { display: none; margin-top: 6px; }
.el.lit > .why, .el.lit > .head > .why { display: flex; flex-wrap: wrap; gap: 4px; }
.why .chip { background: var(--ink); color: var(--paper); }

/* home */
.home { display: grid; gap: 16px; max-width: 1180px; }
/* Home states facts: nothing on it is cut short. */
.home .sum { display: block; -webkit-line-clamp: unset; overflow: visible; }
.band { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px 20px 18px; }
.eyebrow { display: flex; align-items: baseline; gap: 10px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); margin-bottom: 10px; }
.eyebrow .qn, .eyebrow .chip { text-transform: none; letter-spacing: 0; }
.linkish { all: unset; cursor: pointer; margin-left: auto; text-transform: none; letter-spacing: 0; font-size: 12px; color: var(--muted); }
.linkish:hover { color: var(--ink); }
.statement { font: 600 22px/1.3 var(--sans); letter-spacing: -.015em; margin: 0; max-width: 60ch; }
.statement-more { color: var(--muted); margin: 6px 0 0; max-width: 84ch; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px; margin-top: 14px; }
.fact { border: 1px solid var(--line); border-radius: 11px; padding: 9px 12px; background: var(--paper); font-size: 12.5px; }
.fact .fl { font-size: 11px; color: var(--faint); margin-bottom: 4px; }
.fact.slot { border-style: dashed; background: transparent; }
.fact a { color: var(--ink); text-decoration-color: var(--line-strong); text-underline-offset: 2px; }
.clamp { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
ul.plain { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.missing, .warn-text { color: var(--warn); }
.faint { color: var(--faint); }
.crew-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; }
.member { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: var(--paper); }
.member.you { background: var(--card); border-color: var(--line-strong); }
.member .t { font-weight: 600; font-size: 14px; margin-top: 6px; }
.member .who { display: flex; gap: 4px; flex-wrap: wrap; }
.platform-line { margin: 12px 0 0; color: var(--muted); font-size: 12.5px; }
.contract { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
.contract h4 { margin: 0 0 8px; font-size: 12.5px; font-weight: 600; }
.contract li { font-size: 12.5px; padding-left: 10px; border-left: 2px solid var(--line); }
.contract li.alert { border-left-color: var(--warn); }
.journey { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.journey .st { padding: 3px 11px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--card); font-size: 12.5px; }
.journey .st.end { background: var(--paper); border-style: dashed; }
.journey .arrow { color: var(--faint); }
.verdicts li { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 4px 10px; align-items: baseline; padding: 6px 4px; border-radius: 8px; cursor: pointer; }
.verdicts li .sum { grid-column: 2; }
.verdicts .chip { justify-self: start; }
.chip.good { background: #e3efe6; color: var(--good); }
.chip.ink { background: var(--ink); color: var(--paper); }
.identity .health { cursor: pointer; border: 0; margin-left: 4px; font-size: 11.5px; }
.identity .health[hidden] { display: none; }
.band.attention { border-color: #ead9b4; background: #fdf9f0; }
.attention li { display: flex; gap: 12px; align-items: baseline; font-size: 13px; padding-left: 10px; border-left: 2px solid var(--line-strong); }
.attention li.alert { border-left-color: var(--warn); }
.attention li .linkish { flex: none; }
.limits { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
.limits .fl { font-size: 11px; color: var(--faint); margin-right: 4px; }

/* home: emptiness first — the name, what it is for, who works */
.home.zen { max-width: none; display: block; }
.zen-head h1 { margin-bottom: 8px; }
.zen-head p { margin: 0; max-width: 60ch; color: var(--muted); font-size: 15px; line-height: 1.5; }
.zen .tiles { margin-top: 56px; max-width: 860px; }
.zen .tile { border-color: var(--line); }
.zen .sources { margin-top: 14px; }
.zen .team { gap: 112px; grid-auto-columns: auto; justify-content: start; margin-top: 56px; padding-left: 0; }
.zen .team .col { gap: 40px; }
.zen .avatar { width: 64px; height: 64px; box-shadow: none; }
.zen .avatar .ic { width: 28px; height: 28px; }
.zen .nm { font-weight: 500; font-size: 14px; color: #3a3a3c; }

/* home, drawn rather than told */
.home { max-width: 1120px; display: grid; gap: 18px; }
.ic { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: none; vertical-align: -3px; }
.ic.faint { color: var(--faint); }
.hero { display: flex; justify-content: space-between; align-items: flex-start; gap: 28px; padding: 4px 2px 2px; }
.hero h1 { font: 600 24px/1.2 var(--sans); letter-spacing: -.02em; margin: 0; }
.tagline { margin: 6px 0 0; color: var(--muted); font-size: 14px; max-width: 72ch; }
.sources { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.source { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px 3px 8px; border-radius: 999px; background: var(--chip); color: #4a4a4f; font-size: 12px; text-decoration: none; }
.source:hover { background: rgb(0 0 0 / 9%); color: var(--ink); }
.alerts { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex: none; }
.alert { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px 4px 9px; border-radius: 999px; background: var(--chip); color: #4a4a4f; font-size: 12.5px; }
.alert:hover { background: rgb(0 0 0 / 9%); }
.alert.risk { background: var(--warn-bg); color: var(--warn); }
.alert.ok { cursor: default; }
.team { position: relative; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(150px, 210px); justify-content: start; align-items: center; gap: 84px; padding: 10px 4px 6px; }
.team .col { position: relative; z-index: 1; display: flex; flex-direction: column; gap: 22px; }
.node { display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 8px; border-radius: 14px; text-align: center; cursor: pointer; }
.avatar { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; background: #fff; border: 1px solid var(--line); box-shadow: 0 6px 16px rgb(0 0 0 / 6%); color: #48484a; }
.avatar .ic { width: 24px; height: 24px; }
.avatar.you { background: var(--ink); border-color: var(--ink); color: #fff; }
.nm { font-weight: 600; font-size: 13px; }
.badges { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; min-height: 20px; }
.badge { display: inline-flex; align-items: center; gap: 3px; padding: 1px 7px 1px 5px; border-radius: 999px; background: var(--chip); color: #4a4a4f; font-size: 11.5px; font-variant-numeric: tabular-nums; }
.badge .ic { width: 13px; height: 13px; vertical-align: 0; }
.badge.warn { background: var(--warn-bg); color: var(--warn); }
svg.wires { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; z-index: 0; }
.wire { fill: none; stroke: #c9c5bc; stroke-width: 1.5; }
.wire.talk { stroke: var(--ink); }
.wire.unknown { stroke-dasharray: 3 5; }
.wire-tag { position: absolute; z-index: 2; transform: translate(-50%, -50%); width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: #fff; border: 1px solid var(--line); color: var(--ink); font-size: 12px; font-weight: 600; }
.wire-tag.unknown { color: var(--faint); border-style: dashed; }
.floor { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 14px; padding: 8px 12px; border-radius: 12px; border: 1px dashed var(--line-strong); background: var(--paper); }
.floor .fl { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); margin-right: 4px; }
.pchip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px 2px 7px; border-radius: 999px; background: #fff; border: 1px solid var(--line); color: #4a4a4f; font-size: 12px; cursor: pointer; }
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.tile { border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; background: #fff; cursor: pointer; }
.tile.blank { border-style: dashed; background: transparent; color: var(--faint); cursor: default; }
.tile .th { display: flex; align-items: center; gap: 8px; font-weight: 600; }
.tile .th .linkish { margin-left: auto; }
.tile .none { font-size: 22px; margin-top: 10px; }
.stats { display: flex; gap: 22px; margin-top: 12px; }
.stat b { display: block; font-size: 22px; font-weight: 600; letter-spacing: -.02em; line-height: 1.1; }
.stat span { font-size: 11.5px; color: var(--muted); }
.glance table { border-collapse: collapse; }
.glance th, .glance td { padding: 7px 14px; text-align: center; font-weight: 400; }
.glance thead th { color: var(--muted); font-size: 11px; }
.glance thead th .ic { display: block; margin: 0 auto 3px; width: 18px; height: 18px; color: #48484a; }
.glance tbody th { text-align: left; white-space: nowrap; font-weight: 500; }
.glance tbody tr + tr td, .glance tbody tr + tr th { border-top: 1px solid var(--line); }
.glance td { position: relative; }
.glance td.act { cursor: pointer; }
.glance td.act:hover { background: var(--hover); }
.mini { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--line); margin-right: 8px; color: #48484a; vertical-align: middle; }
.mini .ic { width: 13px; height: 13px; vertical-align: 0; }
.mini.you { background: var(--ink); border-color: var(--ink); color: #fff; }
.sym { display: inline-block; width: 12px; height: 12px; border-radius: 50%; vertical-align: middle; }
.sym.s-full { background: var(--ink); }
.sym.s-half { background: linear-gradient(90deg, var(--ink) 50%, transparent 50%); box-shadow: inset 0 0 0 1.5px var(--ink); }
.sym.s-empty { box-shadow: inset 0 0 0 1.5px var(--line-strong); }
.flag { position: absolute; top: 7px; right: calc(50% - 13px); width: 7px; height: 7px; border-radius: 50%; background: var(--warn); }
.glance .legend { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
.glance .legend > span { display: inline-flex; align-items: center; gap: 6px; }
.glance .legend .spacer { flex: 1; }
.lim { color: var(--muted); font-size: 12px; }
.lim b { color: var(--ink); font-weight: 600; margin-right: 3px; }

/* fluid: the Model window shares the desk with the conversation, whose width may change */
nav.tabs { overflow-x: auto; scrollbar-width: none; max-width: 100%; }
.win-head { min-width: 0; min-height: 50px; }

.kicon { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 7px; background: var(--chip); color: #48484a; }
.kicon .ic { width: 14px; height: 14px; vertical-align: 0; }
.card .head { align-items: center; margin-bottom: 6px; }
.col h3 .ic { width: 15px; height: 15px; }

/* explore: a quiet list per concept */
.board { gap: 28px; }
.card.row { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; margin: 0 0 2px; padding: 7px 8px; border: 0; border-radius: 10px; background: transparent; }
.card.row:hover { background: var(--hover); box-shadow: none; }
.card.row .t { font-weight: 500; }
.card.row .kicon { background: transparent; color: var(--faint); width: 18px; }
.card.row .times { margin-left: auto; color: var(--faint); font-size: 12px; }
.card.row .why { flex-basis: 100%; }
.col h3 { margin-bottom: 10px; }
.col .group { margin: 14px 8px 4px; }

/* flows in page elements: cards on a thread, branches side by side */
.vflow { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; }
.vflow > li { position: relative; display: flex; flex-direction: column; align-items: center; padding-top: 18px; }
.vflow > li::before { content: ""; position: absolute; top: 0; left: 50%; height: 18px; border-left: 1.5px solid #cfcac0; }
.vflow.root > li:first-child { padding-top: 0; }
.vflow.root > li:first-child::before { display: none; }
.vstart::after, .vend::after { content: ""; display: block; width: 10px; height: 10px; border-radius: 50%; background: var(--ink); }
.vend::after { width: 8px; height: 8px; box-shadow: 0 0 0 2.5px #fff, 0 0 0 4px var(--ink); }
.vcard { display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 150px; padding: 9px 16px; border: 1px solid #d9d5cc; border-radius: 12px; background: #fff; }
.vcard b { font-weight: 500; font-size: 13.5px; }
.vcard .who { font-size: 11.5px; }
.vloop { margin-top: 4px; font-size: 11.5px; color: var(--faint); }
.vdiamond { width: 14px; height: 14px; transform: rotate(45deg); border: 1.5px solid #8f8a80; background: #fff; border-radius: 2px; }
.vbranches { display: flex; align-items: flex-start; margin-top: 18px; position: relative; }
.vbranches::before { content: ""; position: absolute; top: -18px; left: 50%; height: 18px; border-left: 1.5px solid #cfcac0; }
.vbranch { position: relative; display: flex; flex-direction: column; align-items: center; padding: 18px 14px 0; }
.vbranch::before { content: ""; position: absolute; top: 0; left: 0; right: 0; border-top: 1.5px solid #cfcac0; }
.vbranch:first-child::before { left: 50%; }
.vbranch:last-child::before { right: 50%; }
.vbranch:only-child::before { display: none; }
.vbranch::after { content: ""; position: absolute; top: 0; left: 50%; height: 18px; border-left: 1.5px solid #cfcac0; }
.vlabel { position: relative; z-index: 1; margin-top: -9px; padding: 0 7px; background: #fff; color: var(--faint); font-size: 11.5px; font-style: italic; }
.vbranch > .vflow > li:first-child { padding-top: 10px; }
.vbranch > .vflow > li:first-child::before { height: 10px; }
.vgoto { color: var(--muted); font-size: 12.5px; }
.vgoto::after { content: ""; }
.vmerge { color: var(--faint); font-size: 12px; letter-spacing: .02em; }
.life { display: flex; gap: 14px; align-items: flex-start; overflow-x: auto; padding: 6px 2px; }
.life-col { display: flex; flex-direction: column; gap: 10px; }
.life-state { padding: 8px 16px; border: 1px solid #d9d5cc; border-radius: 999px; background: #fff; font-size: 13px; white-space: nowrap; }
.life-state.initial { border-color: var(--ink); }
.life-state.terminal { border-style: dashed; background: var(--paper); }

/* team map, force layout */
.tmap.force { display: block; width: 100%; margin-bottom: 24px; }
.tmap .fnode-abs { position: absolute; left: 0; top: 0; z-index: 1; cursor: grab; user-select: none; }
.tmap line.wire.uses { stroke: #dcd8cf; stroke-width: 1.2; }
.tmap line.wire.handoff { stroke: #8f8a80; stroke-width: 1.5; }
.tmap line.wire.talk { stroke: var(--ink); stroke-width: 1.5; }
.tmap { position: relative; display: flex; flex-direction: column; align-items: center; gap: 72px; padding: 18px 0 30px; margin-bottom: 28px; }
.tband { position: relative; z-index: 1; display: flex; flex-wrap: wrap; justify-content: center; gap: 12px 18px; }
.tband.agents { gap: 18px 56px; }
.tband.agents .node { cursor: pointer; }
.tband.agents .node.picked .avatar { border-color: var(--ink); box-shadow: 0 0 0 3px rgb(0 0 0 / 6%); }
.tres .anchor { display: inline-flex; align-items: center; gap: 6px; padding: 4px 11px 4px 9px; border-radius: 999px; background: #fff; border: 1px solid var(--line); color: #4a4a4f; font-size: 12.5px; }
.tres.shared .anchor { border-color: #bdb8ad; color: var(--ink); font-weight: 500; }
.tres .times { margin-left: 2px; }
.tmap svg.wires { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; z-index: 0; }
.tmap .wire.uses { stroke: #dcd8cf; stroke-width: 1.2; }
.tmap .wire.handoff { stroke: #8f8a80; stroke-width: 1.5; }
.tmap .wire.talk { stroke: var(--ink); stroke-width: 1.5; }
.home-attention { margin-top: 40px; max-width: 520px; gap: 2px; }
.home-attention li { display: flex; align-items: center; gap: 12px; padding: 9px 8px; border-radius: 9px; cursor: pointer; font-size: 14px; }
.home-attention li:hover { background: var(--hover); }
.home-attention li .faint { margin-left: auto; }
.home-attention li > span:nth-child(2) { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.home-attention.flash { border-radius: 9px; animation: flash 1.1s ease-out; }
.page-decide .home-attention { margin-top: 0; }
@keyframes flash { from { background: var(--warn-bg); } to { background: transparent; } }

/* team: one agent at a time */
.split.team-page { grid-template-columns: 200px minmax(0, 1fr); gap: 36px; }
.team-page .picker button { display: flex; align-items: center; gap: 8px; padding: 6px 10px; }
.team-page .picker button[aria-current="true"] { background: rgb(0 0 0 / 5.5%); box-shadow: none; font-weight: 500; }
.team-page .picker .mini { margin-right: 0; }
.profile { max-width: 820px; }
.profile-head { display: flex; align-items: center; gap: 16px; margin-bottom: 22px; }
.profile-head .avatar { width: 56px; height: 56px; }
.profile-head h2 { margin: 0 0 2px; font-size: 18px; font-weight: 600; letter-spacing: -.01em; }
.profile-head .faint { font-size: 13px; }
.mandate { margin: 10px 0 0; color: #4a4a4f; font-size: 13.5px; max-width: 70ch; }

/* evolution: versions, proposals, diffs */
.feed-group { margin: 18px 8px 4px; font-size: 12px; color: var(--faint); }
.feed-group:first-of-type { margin-top: 0; }
.mount { display: flex; gap: 14px; align-items: flex-start; max-width: 640px; padding: 22px 24px; border: 1px dashed var(--line-strong); border-radius: 16px; }
.mount .ic { width: 20px; height: 20px; color: var(--faint); }
.mount b { font-weight: 600; }
.mount a { display: inline-block; margin-top: 10px; color: var(--ink); font-size: 13px; }
.timeline { max-width: 900px; }
.cases { max-width: 680px; display: grid; gap: 2px; }
.case-row { all: unset; box-sizing: border-box; cursor: pointer; display: grid; grid-template-columns: 14px minmax(0, 1fr); column-gap: 10px; width: 100%; padding: 8px 8px; border-radius: 10px; }
.case-row:hover { background: var(--hover); }
.case-row.current { background: rgb(0 0 0 / 5.5%); }
.case-dot { grid-row: 1 / span 2; width: 7px; height: 7px; margin-top: 6px; border-radius: 50%; border: 1.5px solid var(--faint); box-sizing: border-box; justify-self: center; }
.case-dot.done { background: var(--faint); }
.case-title { font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.case-ago { grid-column: 2; font-size: 11.5px; color: var(--faint); }
.page.page-cases { min-height: 100%; display: flex; flex-direction: column; padding-bottom: 16px; }
.page.page-cases > .case-composer { margin-top: auto; position: sticky; bottom: 16px; box-shadow: 0 0 0 16px var(--card); }
.case-composer { display: block; box-sizing: border-box; width: 100%; max-width: 680px; font: inherit; font-size: 14px; padding: 11px 16px; border: 1px solid var(--line); border-radius: 22px; background: #fff; outline: none; }
.case-composer:focus { border-color: var(--line-strong); }
.change { border-bottom: 1px solid var(--line); }
.change-row { all: unset; box-sizing: border-box; cursor: pointer; display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; grid-template-rows: auto auto; column-gap: 12px; width: 100%; padding: 12px 8px; border-radius: 10px; }
.change-row:hover { background: var(--hover); }
.cmark { grid-row: span 2; width: 10px; height: 10px; border-radius: 50%; margin-top: 4px; box-shadow: inset 0 0 0 1.5px var(--ink); }
.cmark.head { background: var(--ink); }
.cmark.merged { background: #8f8a80; box-shadow: none; }
.cmark.pending { box-shadow: inset 0 0 0 1.5px var(--warn); }
.cmark.declined { box-shadow: inset 0 0 0 1.5px var(--faint); }
.change.declined .ctitle { color: var(--muted); }
.decide { display: flex; gap: 6px; padding: 0 8px 12px 34px; }
.decide button { all: unset; cursor: pointer; padding: 3px 12px; border-radius: 999px; background: var(--chip); font-size: 12px; color: #4a4a4f; }
.decide button:hover { background: rgb(0 0 0 / 9%); color: var(--ink); }
.ctitle { font-weight: 500; }
.cmeta { grid-column: 2; font-size: 12px; color: var(--muted); }
.cmeta code { font: 11.5px var(--mono); color: var(--faint); }
.change-row .faint { grid-row: 1 / span 2; grid-column: 3; align-self: center; font-size: 12px; }
.diffs { display: grid; gap: 10px; padding: 4px 8px 16px 34px; }
.dfile { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.dhead { display: flex; align-items: center; gap: 10px; padding: 7px 12px; background: var(--paper); font-size: 12.5px; }
.dhead .faint { margin-left: auto; font-size: 12px; }
.dstat { font-size: 11px; padding: 0 7px; border-radius: 999px; background: var(--chip); }
.dstat.s-A { color: var(--good); } .dstat.s-D { color: var(--bad); }
.dbody { margin: 0; font: 12px/1.55 var(--mono); overflow-x: auto; }
.dbody div { padding: 0 12px; white-space: pre; }
.dbody .add { background: #edf6ef; color: #1f5133; }
.dbody .del { background: #fbeceb; color: #7d2a24; }
.dbody .hunk { color: var(--faint); background: #f7f6f3; }

/* drawn flows: lanes per performer, nodes, diamonds, arrows */
.flowchart { overflow-x: auto; min-width: 0; }
.flowchart svg.chart { border-radius: 14px; }
svg.chart { display: block; font-family: var(--sans); max-width: 100%; height: auto; }
svg.chart .lane { fill: #fcfbf9; }
svg.chart .lane.alt { fill: #f7f6f3; }
svg.chart .lane-label { font-size: 12px; font-weight: 500; fill: #4a4a4f; }
svg.chart .edge { fill: none; stroke: #b9b5ac; stroke-width: 1.4; }
svg.chart .edge.loop { stroke-dasharray: 4 4; }
svg.chart .edge-label { font-size: 11px; font-style: italic; fill: var(--faint); }
svg.chart .box { fill: #fff; stroke: #cfcac0; stroke-width: 1.2; }
svg.chart .box.state { fill: #fff; }
svg.chart .box.terminal { fill: #faf9f7; stroke-dasharray: 3 3; }
svg.chart .box-label { font-size: 12.5px; font-weight: 500; fill: var(--ink); pointer-events: none; }
svg.chart .diamond { fill: #fff; stroke: #8f8a80; stroke-width: 1.3; }
svg.chart .diamond.merge { fill: #e7e4dd; stroke: #b9b5ac; }
svg.chart .start { fill: var(--ink); }
svg.chart .end-ring { fill: #fff; stroke: var(--ink); stroke-width: 1.4; }
svg.chart .end-dot { fill: var(--ink); }
svg.chart .fnode { cursor: pointer; }
svg.chart .fnode:hover .box { stroke: #8f8a80; }
svg.chart .fnode.sel .box { stroke: var(--ink); stroke-width: 2; }
svg.chart .fnode.lit .box { stroke: var(--ink); }
.dimmed svg.chart .fnode.el:not(.lit):not(.sel):not(.rel-ctx) { opacity: .35; }
/* context: what the AI sees, uses and keeps */
.ctx { display: grid; gap: 14px; max-width: 900px; }
.ctx-sec { border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px; }
.ctx-sec.blank { border-style: dashed; }
.ctx-head { display: flex; align-items: center; gap: 10px; }
.ctx-head h3 { margin: 0; font-size: 15px; font-weight: 600; }
.ctx-head .faint { font-size: 12px; }
.ctx-head + .faint { margin-top: 8px; font-size: 13px; }
.ctx .stats { margin-top: 14px; flex-wrap: wrap; }
.ctx .stat { padding: 2px 4px; border-radius: 8px; }
.ctx-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 12px; }
.ctx-row .fl { width: 64px; font-size: 11.5px; color: var(--faint); }
.ctx-row .rule { font-size: 12.5px; color: #4a4a4f; padding: 1px 8px; border-radius: 999px; background: var(--chip); }
.qsub { margin-top: 2px; font-size: 12px; color: var(--faint); }
.qsub .fl { color: var(--muted); }
.qon { margin-left: 8px; font-size: 12px; color: var(--faint); }
.roster { display: flex; flex-wrap: wrap; gap: 18px 10px; margin-top: 48px; }
.roster .node { width: 104px; }
.roster .avatar { width: 46px; height: 46px; }

/* flows look like flows: each step is a node on a thread; decisions are diamonds; branches step aside */
.zen-steps .step { position: relative; }
.zen-steps .body { position: relative; }
.zen-steps .rail i { border-left-color: var(--line-strong); }
.node-mark { position: relative; flex: none; width: 18px; height: 22px; display: grid; place-items: center; }
.node-mark::before { content: ""; position: absolute; left: 50%; top: -12px; bottom: -12px; border-left: 1.5px solid var(--line-strong); }
.node-mark::after { content: ""; position: relative; width: 9px; height: 9px; border-radius: 50%; background: #fff; box-shadow: inset 0 0 0 1.5px var(--ink); }
.node-mark.decision::after, .node-mark.merge::after { border-radius: 2px; transform: rotate(45deg); width: 8px; height: 8px; }
.node-mark.merge::after { background: var(--ink); }
.node-mark.start::after { background: var(--ink); width: 8px; height: 8px; }
.node-mark.done::after { box-shadow: inset 0 0 0 1.5px var(--ink), 0 0 0 2.5px #fff, 0 0 0 4px var(--ink); width: 7px; height: 7px; }
.node-mark.goto::after { background: transparent; box-shadow: none; }
.zen-steps .step:first-child .node-mark::before { top: 50%; }
.zen-steps .step:last-child .node-mark::before { bottom: 50%; }
.zen-steps .step.control .name { color: var(--muted); }
.zen-steps .step:not(.control) .name { font-weight: 500; }

/* flows, requirements, rights: lists and marks, nothing around them */
.split.flows { grid-template-columns: 180px minmax(0, 1fr); gap: 28px; }
.flows .picker button { display: flex; align-items: center; gap: 8px; padding: 6px 10px; }
.flows .picker button[aria-current="true"] { background: rgb(0 0 0 / 5.5%); box-shadow: none; font-weight: 500; }
.times { margin-left: auto; color: var(--faint); font-size: 12px; font-weight: 400; white-space: nowrap; }
.zen-steps { padding: 0; }
.zen-steps .step { grid-template-columns: minmax(0, 1fr) auto; padding: 6px 8px; border-radius: 9px; }
.zen-steps .step:hover { background: var(--hover); box-shadow: none; }
.zen-steps .glyph { color: var(--faint); }
.zen-steps .step .guard { background: transparent; padding: 0; color: var(--faint); font: italic 12.5px var(--sans); max-width: none; }
.zen-steps .loop { color: var(--faint); }
.zen-steps .name { font-size: 13.5px; }
.who { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }
.who i { width: 7px; height: 7px; border-radius: 50%; background: var(--ink); }
.who.platform i { background: transparent; box-shadow: inset 0 0 0 1.5px var(--faint); }
.flag-inline { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--warn); }

.scope { background: var(--paper); border: 1px solid var(--line-strong); border-radius: 14px; padding: 14px 16px 16px; margin-bottom: 22px; }

/* states */
.track { display: grid; gap: 12px; align-items: start; margin-top: 12px; overflow-x: auto; padding-bottom: 6px; }

/* matrices */
.matrix { border-collapse: separate; border-spacing: 0; background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }

.matrix thead th.vert { height: 150px; white-space: nowrap; }
.matrix thead th.vert span { display: inline-block; writing-mode: vertical-rl; transform: rotate(180deg); max-height: 140px; overflow: hidden; text-overflow: ellipsis; }

.dot { display: inline-block; width: 11px; height: 11px; border-radius: 50%; vertical-align: middle; }

.cell { cursor: pointer; }
.cell.sel { outline: 2px solid var(--ink); outline-offset: -3px; border-radius: 6px; }
.legend { display: flex; gap: 14px; margin: 10px 0 0; color: var(--muted); font-size: 12px; align-items: center; flex-wrap: wrap; }
.scroll-x { overflow-x: auto; }

/* requirements, definitions, views */
.reqs { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
.req { background: var(--card); border: 1px solid var(--line); border-radius: 11px; padding: 11px 13px; }
.clause { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); }
.expr { font: 11.5px/1.5 var(--mono); background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 5px 7px; margin-top: 4px; white-space: pre-wrap; word-break: break-word; }
.defs { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
.def { background: var(--card); border: 1px solid var(--line); border-radius: 3px; padding: 9px 11px; }
.def.usage { border-radius: 11px; }
.compartment { margin-top: 7px; padding-top: 6px; border-top: 1px solid var(--line); }
.compartment .ct { font-size: 10.5px; color: var(--faint); font-style: italic; }

.filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.filters button { all: unset; cursor: pointer; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); font-size: 12px; color: var(--muted); }
.filters button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }

/* sources */
.src { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 14px; }
/* Revisions */
.rev { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 28px; align-items: start; }
.rev-list { position: sticky; top: 12px; display: grid; gap: 10px; }
.seg { display: inline-flex; gap: 2px; padding: 2px; border-radius: 9px; background: var(--chip); justify-self: start; }
.seg button { all: unset; cursor: pointer; padding: 4px 12px; border-radius: 7px; font-size: 12.5px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / 8%); }
.seg.small button { padding: 2px 9px; font-size: 12px; }
.seg .count { display: inline-block; min-width: 16px; padding: 0 4px; border-radius: 999px; background: var(--warn-bg); color: var(--warn); font-size: 11px; text-align: center; }
.rev-list ol { display: grid; gap: 1px; list-style: none; margin: 0; padding: 0; }
.rev-row { all: unset; box-sizing: border-box; cursor: pointer; display: grid; grid-template-columns: 14px minmax(0, 1fr); column-gap: 10px; row-gap: 3px; width: 100%; padding: 9px 10px; border-radius: 10px; }
.rev-row:hover { background: var(--hover); }
.rev-row[aria-current="true"] { background: rgb(0 0 0 / 5.5%); }
.rev-row > :first-child { grid-row: 1 / span 2; align-self: start; margin-top: 5px; }
.rev-dot { width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid var(--faint); box-sizing: border-box; justify-self: center; }
.rev-row[aria-current="true"] .rev-dot { border-color: var(--ink); background: var(--ink); }
.rev-title { font-size: 13px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.rev-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 11.5px; color: var(--faint); }
.rev-meta code { font: 11.5px var(--mono); color: var(--muted); }
.rev-meta .chip { font-size: 11px; padding: 0 6px; color: var(--muted); }
.chip.run { background: #e8f3ec; color: #1f6b3a; }
.rev-row.is-declined .rev-title { color: var(--faint); text-decoration: line-through; text-decoration-color: rgb(0 0 0 / 20%); }
.rev-detail { min-width: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
.rev-head h2 { font: 600 16px/1.35 var(--sans); margin: 0 0 4px; }
.rev-head .faint { font-size: 12.5px; }
.rev-head code { font: 12px var(--mono); }

.rev-bar .seg { margin-left: auto; }
.chip.st-accepted { background: #e8f3ec; color: #1f6b3a; } .chip.st-declined { color: var(--faint); }
/* Diff2Html, toned to the window */
.d2h-host .d2h-wrapper { font-family: var(--mono); }
.d2h-host .d2h-file-wrapper { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin-bottom: 12px; }
.d2h-host .d2h-file-header { background: var(--paper); border-bottom: 1px solid var(--line); padding: 7px 12px; height: auto; font-family: var(--sans); font-size: 12.5px; }
.d2h-host .d2h-file-name.go { cursor: pointer; } .d2h-host .d2h-file-name.go:hover { text-decoration: underline; }
.d2h-host .d2h-tag { border-radius: 999px; font-size: 10.5px; }
.d2h-host { min-width: 0; }
.d2h-host .d2h-code-line, .d2h-host .d2h-code-side-line { font-size: 12px; }
.d2h-host .d2h-info { color: var(--faint); background: #f7f6f3; border-color: var(--line); }
.d2h-host .d2h-code-linenumber, .d2h-host .d2h-code-side-linenumber { color: var(--faint); border-color: var(--line); }
.change .d2h-host { padding: 4px 8px 16px 34px; }
.dlist { display: grid; gap: 2px; border: 1px solid var(--line); border-radius: 10px; padding: 6px; }
.dlist .linkish { margin: 0; display: flex; align-items: center; gap: 10px; width: 100%; padding: 5px 8px; border-radius: 7px; font: 12.5px var(--mono); color: var(--ink); text-align: left; }

/* Files */
.repo { display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 24px; align-items: start; }
.tree { position: sticky; top: 12px; display: grid; gap: 1px; }
.tree-dir { font-size: 11.5px; color: var(--faint); padding: 0 10px 6px; }
.tree-file { all: unset; box-sizing: border-box; cursor: pointer; padding: 5px 10px; border-radius: 8px; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.code .t-c { color: var(--faint); font-style: italic; }
.code .t-s { color: #2a6a49; }

.code { background: var(--card); border: 1px solid var(--line); border-radius: 10px; font: 12px/1.6 var(--mono); overflow: auto; }
.code div { display: grid; grid-template-columns: 44px 1fr; white-space: pre; }

.code div.hl { background: #fff5d6; }

/* inspector */
/* Peek: details float beside what was clicked, like a Mac popover; nothing is pinned. */
aside.inspector { display: none; position: relative; margin: 6px 0 14px; padding: 12px 14px 12px; max-width: 560px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; animation: peek-in .14s ease-out; }

/* A table row's detail does not widen the table: its slot has no width and the detail overhangs it. */

.detail-slot { position: sticky; left: 12px; width: 0; }
.detail-slot aside.inspector { width: min(560px, calc(100cqw - 24px)); max-width: none; }
.matrix:has(.detail-row) { overflow: visible; }
.matrix tbody tr.detail-row:hover td { background: var(--card); }
@keyframes peek-in { from { opacity: 0; transform: translateY(4px) scale(.98); } to { opacity: 1; transform: none; } }
aside .x { all: unset; cursor: pointer; position: absolute; top: 10px; right: 10px; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: rgb(0 0 0 / 5%); color: #5a5a5f; font-size: 14px; }
aside .x:hover { background: rgb(0 0 0 / 9%); }
aside h2 { margin: 2px 32px 0 0; font-size: 15px; font-weight: 600; letter-spacing: -.01em; word-break: break-word; }
aside .peek-sum { margin: 6px 0 0; color: var(--muted); font-size: 12.5px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
aside dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; margin: 12px 0 0; font-size: 12px; }
aside dt { color: var(--faint); white-space: nowrap; }
aside dd { margin: 0; word-break: break-word; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
aside .rel { margin-top: 12px; display: grid; gap: 8px; }
aside .rel h5 { margin: 0 0 4px; font-size: 11px; font-weight: 500; color: var(--faint); }
aside .rel .chips { display: flex; flex-wrap: wrap; gap: 4px; }
aside .rel .chips button { all: unset; cursor: pointer; padding: 1px 8px; border-radius: 999px; background: var(--chip); color: #4a4a4f; font-size: 12px; }
aside .rel .chips button:hover { background: rgb(0 0 0 / 9%); color: var(--ink); }
aside .actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 14px; padding-top: 10px; border-top: 1px solid var(--line); }
aside .actions button { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px 3px 8px; border-radius: 999px; background: var(--chip); font-size: 12px; color: #4a4a4f; }
aside .actions button:hover { background: rgb(0 0 0 / 9%); color: var(--ink); }

/* fluid: container rules come last so they override the base rules above */
@container win (max-width: 980px) { .win-head .title { display: none; } .search input { width: 150px; } }
@container win (max-width: 760px) { .win-head .toggle { display: none; } }
@container page (max-width: 900px) {
  .hero { flex-direction: column; gap: 12px; }
  .alerts { flex-direction: row; flex-wrap: wrap; align-items: center; }
  .tiles { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
  .team { gap: 44px; grid-auto-columns: minmax(110px, 170px); }
  .split, .split.flows, .split.team-page { grid-template-columns: minmax(0, 1fr); }
  .picker { position: static; display: flex; flex-wrap: wrap; gap: 4px; }
  .picker .group { width: 100%; }
  .picker button { width: auto; }
}
@container page (max-width: 600px) {
  .team { grid-auto-flow: row; justify-content: stretch; justify-items: center; gap: 34px; }
  .team .col { flex-direction: row; flex-wrap: wrap; justify-content: center; gap: 18px; }
  .glance { overflow-x: auto; }
}

function policyPhrase(v) {
  if (["id", "revision"].includes(v.name)) return null;

// Limits: every numeric max* value of the execution policies, said once when every system shares it.
function limits() {
  const out = new Map();

    for (const v of it.values || []) {

      const text = policyPhrase(v);

  return [...out.values()];
}

const STACKS = { "#dockjobs": { title: "Jobs", empty: "No job scheduled yet." }, "#dockwatches": { title: "Watches", empty: "Nothing is watched yet." } };

// ---------- force-directed graph ----------
const HUES = { platform: "#9aa3ad", team: "#5d6f8e", cando: "#5f8a6b", rules: "#a07a3e", guarantees: "#8d5d73", information: "#7a7a7a" };
const COLUMN_TITLE = { team: "Team", platform: "Platform", cando: "Can do", rules: "Rules", guarantees: "Guarantees", information: "Information" };
let G = null;
function graphModel() {
  const nodes = [], ids = new Set();
  const add = (x, column) => { if (!ids.has(x.id)) { ids.add(x.id); nodes.push({ id: x.id, column, title: x.title, x0: x }); } };
  for (const c of M.b.columns) for (const it of c.items || []) {
    if (c.id === "team") for (const p of flatPanels(it)) add(p, p.kind === "machine" ? "platform" : "team"); else add(it, c.id);
  }
  // A link lands on the nearest element shown as a node (a port on its part, a step on its flow).
  const nodeOf = (id) => { for (let at = id; at; at = M.parent.get(at)) if (ids.has(at)) return at; return null; };
  const seen = new Map();
  for (const l of M.links) {
    if (l.kind === "own" || l.strength === "scope") continue;
    const a = nodeOf(l.from), b = nodeOf(l.to);
    if (!a || !b || a === b) continue;
    const key = [a, b].sort().join("|") + l.kind;
    if (!seen.has(key)) seen.set(key, { source: a, target: b, kind: l.kind });
  }
  for (const n of nodes) { const up = M.parent.get(n.id); if (up && ids.has(up)) seen.set(`${n.id}|contains`, { source: up, target: n.id, kind: "contains" }); }
  const links = [...seen.values()];
  const degree = new Map(); for (const l of links) for (const e of [l.source, l.target]) degree.set(e, (degree.get(e) || 0) + 1);
  for (const n of nodes) n.r = 4 + Math.sqrt(degree.get(n.id) || 0) * 2.2;
  const counts = new Map(); for (const n of nodes) counts.set(n.title, (counts.get(n.title) || 0) + 1);
  for (const n of nodes) { const sc = M.reg.get(n.id)?.scope; if (counts.get(n.title) > 1 && sc && sc !== n.id) n.title = `${n.title} · ${title(sc)}`; }
  return { nodes, links, degree };
}
// The pure SysML mode: standard diagrams in SysML v2 notation, with their exports.
const SYSML_GROUP = { structure: "interconnection", behavior: "action flow", state: "state machine", declared: "declared view", definitions: "general" };
const sysmlViewsOf = (qname) => (M.data.sysmlViews || []).filter((v) => v.qnames.includes(qname)).sort((a, b) => a.qnames.length - b.qnames.length).slice(0, 4);
function openSysml(view, qname) { S.space = "evolution"; S.window = true; S.evoPage = "sysml"; S.sysmlAt = { view, qname }; render(); }

pages.graph = () => {
  if (!G || G.system !== M) G = makeGraph();
  requestAnimationFrame(() => G.center());
  return [h("h1", {}, "Graph"), G.el];
};
function makeGraph() {
  const { nodes, links, degree } = graphModel();
  const el = h("div", { class: "graph" });
  const svg = d3.select(el).append("svg");
  const g = svg.append("g");
  svg.call(d3.zoom().scaleExtent([0.2, 4]).on("zoom", (e) => g.attr("transform", e.transform)));
  const line = g.append("g").selectAll("line").data(links).join("line").attr("class", (d) => `gl ${d.kind}`);
  const node = g.append("g").selectAll("g").data(nodes).join("g").attr("class", "gn")
    .on("click", (e, d) => { e.stopPropagation(); select(S.selected === d.id ? null : d.id); })
    .on("dblclick", (e, d) => { e.stopPropagation(); select(d.id, { go: true }); })
    .call(d3.drag().on("start", (e, d) => { if (!e.active) sim.alphaTarget(0.25).restart(); d.fx = d.x; d.fy = d.y; })
      .on("drag", (e, d) => { d.fx = e.x; d.fy = e.y; }).on("end", (e, d) => { if (!e.active) sim.alphaTarget(0); d.fx = null; d.fy = null; }));
  node.append("circle").attr("r", (d) => d.r).attr("fill", (d) => HUES[d.column] || "#888");
  node.append("text").attr("x", (d) => d.r + 3).attr("y", 4).text((d) => d.title);
  const sim = d3.forceSimulation(nodes)
    .force("link", d3.forceLink(links).id((d) => d.id).distance((l) => l.kind === "contains" ? 46 : 110).strength((l) => l.kind === "contains" ? 0.8 : 0.18))
    .force("charge", d3.forceManyBody().strength(-340).distanceMax(600))
    .force("collide", d3.forceCollide().radius((d) => d.r + 12))
    .force("x", d3.forceX().strength(0.03)).force("y", d3.forceY().strength(0.04))
    .on("tick", () => {
      line.attr("x1", (d) => d.source.x).attr("y1", (d) => d.source.y).attr("x2", (d) => d.target.x).attr("y2", (d) => d.target.y);
      node.attr("transform", (d) => `translate(${d.x},${d.y})`);
    });
  svg.on("click", () => select(null));
  const legend = h("div", { class: "glegend" }, Object.entries(COLUMN_TITLE).filter(([k]) => nodes.some((n) => n.column === k)).map(([k, t]) => h("span", {}, h("i", { style: `background:${HUES[k]}` }), t)));
  el.append(legend);
  // Centre once the graph is on screen: a detached SVG has no size to resolve.
  const center = () => { if (!el.isConnected || G?.centered) return; const r = el.getBoundingClientRect(); svg.call(d3.zoom().transform, d3.zoomIdentity.translate(r.width / 2, r.height / 2)); g.attr("transform", `translate(${r.width / 2},${r.height / 2})`); G.centered = true; };
  // Labels stay for well-connected elements; the rest appear on focus.

}
function graphFocus() {
  if (!G) return;
  const id = S.selected;
