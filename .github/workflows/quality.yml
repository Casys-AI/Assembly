name: Qualité

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Qualité et build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ASSEMBLY_SEMANTIC_INTEGRATION: "0"
      ASSEMBLY_REAL_CLAUDE: "0"
      DENO_NO_UPDATE_CHECK: "1"
    steps:
      - name: Récupérer les sources
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Installer la version Deno du dépôt
        uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282 # v2.0.4
        with:
          deno-version-file: .deno-version

      - name: Installer Node et npm
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Installer les dépendances de l'atelier depuis le lockfile
        working-directory: apps/live-builder
        run: deno ci

      - name: Installer les dépendances de l'interface depuis le lockfile
        working-directory: apps/live-builder/frontend
        run: deno ci

      # Les addons natifs sont construits et qualifiés par native-runtimes.yml ;
      # ici seul le runtime Deno épinglé est préparé, sans compilation Rust/npm.
      - name: Préparer uniquement le runtime Deno épinglé
        working-directory: apps/live-builder
        run: >-
          deno eval --no-prompt --allow-read --allow-write --allow-env
          "import { installRuntime } from './tools/setup.ts';
          console.log(await installRuntime());"

      - name: Vérifier format, lint, types et tests
        run: nice -n 15 deno task quality

      - name: Vérifier toutes les intégrations sans infrastructure native
        run: nice -n 15 deno task test:integration:full --allow-slow

      - name: Construire et vérifier l'interface
        run: nice -n 15 deno task build
